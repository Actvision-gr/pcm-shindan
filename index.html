<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コミュニケーションタイプ診断</title>
<style>
  :root {
    --bg: #14161c;
    --surface: #1d2029;
    --surface-2: #262a35;
    --text: #ecebe6;
    --text-dim: #9aa0af;
    --line: #333846;

    --c-imaginer: #6c8ebf;
    --c-harmonizer: #cf7c8a;
    --c-thinker: #4fa392;
    --c-persister: #c99a3e;
    --c-rebel: #d97a3f;
    --c-promoter: #c0524a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }

  .app {
    width: 100%;
    max-width: 460px;
  }

  h1 {
    font-family: Georgia, "Hiragino Mincho ProN", serif;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 0.01em;
    margin: 4px 0 6px;
  }

  .lede {
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 28px;
  }

  .progress-track {
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 28px;
  }
  .progress-fill {
    height: 100%;
    background: var(--text);
    transition: width 0.35s ease;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px 22px;
  }

  .q-count {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .q-text {
    font-size: 15px;
    margin-bottom: 18px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option-card {
    text-align: left;
    padding: 16px 16px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text);
    font-size: 14.5px;
    line-height: 1.5;
    cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease, transform 0.12s ease;
    width: 100%;
    font-family: inherit;
  }
  .option-card:hover { border-color: var(--text-dim); }
  .option-card:active { transform: scale(0.99); }
  .option-card.chosen {
    border-color: var(--text);
    background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--text);
  }
  .or-label {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
  }

  .nav {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
  }
  .nav button {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    padding: 6px 4px;
    font-family: inherit;
  }
  .nav button:disabled { opacity: 0.3; cursor: default; }
  .nav button:not(:disabled):hover { color: var(--text); }

  /* Result screen */
  .result-title {
    font-family: Georgia, serif;
    font-size: 26px;
    margin: 4px 0 4px;
  }
  .result-sub {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 26px;
  }

  .bars {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 30px;
  }
  .bar-row {
    display: grid;
    grid-template-columns: 88px 1fr 34px;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }
  .bar-label { color: var(--text-dim); }
  .bar-label.top { color: var(--text); font-weight: 600; }
  .bar-track {
    height: 10px;
    background: var(--surface-2);
    border-radius: 6px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 6px;
    transition: width 0.6s ease;
  }
  .bar-val { text-align: right; color: var(--text-dim); }

  .detail-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent, var(--text));
    border-radius: 10px;
    padding: 22px 20px;
    margin-bottom: 16px;
  }
  .detail-card h3 {
    margin: 0 0 4px;
    font-size: 16px;
  }
  .detail-card .tag {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 14px;
  }
  .detail-card dl {
    margin: 0;
    font-size: 14px;
  }
  .detail-card dt {
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 12px;
  }
  .detail-card dt:first-child { margin-top: 0; }
  .detail-card dd {
    margin: 3px 0 0;
  }

  .section-label {
    font-size: 12px;
    color: var(--text-dim);
    margin: 16px 0 6px;
  }

  .detail-list {
    margin: 0;
    padding-left: 18px;
    font-size: 13.5px;
  }
  .detail-list li {
    margin-bottom: 5px;
  }
  .detail-list.do li::marker { color: var(--accent, var(--text)); }
  .detail-list.dont li { color: var(--text-dim); }

  .case-study {
    font-size: 13.5px;
    background: var(--surface-2);
    border-radius: 8px;
    padding: 14px 16px;
    margin: 0;
  }

  .channel-detail {
    font-size: 13.5px;
    margin: 0 0 10px;
  }

  .detail-list.example li {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  .stage-block {
    background: var(--surface-2);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .stage-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .stage-desc {
    font-size: 12.5px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .stage-sub {
    font-size: 11.5px;
    color: var(--text-dim);
    margin: 8px 0 3px;
  }

  .role-block {
    font-size: 13.5px;
  }
  .role-note {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 8px;
  }

  .restart {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .restart:hover { border-color: var(--text-dim); }

  .report-actions {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .report-actions button {
    flex: 1;
    padding: 12px 10px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .report-actions button:hover { border-color: var(--text-dim); }

  .report-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  .report-meta label {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .report-meta input {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 10px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    min-width: 160px;
  }
  .print-only-meta { display: none; }

  @media print {
    body { background: #fff; color: #1a1a1a; padding: 0; }
    .app { max-width: 100%; }
    .report-actions, .restart, .progress-track { display: none !important; }
    .report-meta input { display: none; }
    .print-only-meta { display: block !important; color: #333; margin-bottom: 4px; }
    .detail-card, .bars {
      background: #fff;
      border-color: #ddd;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .bar-track, .stage-block, .case-study {
      background: #f3f3f3;
    }
    .result-sub, .tag, .bar-label, .section-label, .stage-desc, .stage-sub, .role-note, .lede {
      color: #555;
    }
    h1, .result-title, h3 { color: #111; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>

const VARIANT_COUNT = 3;

function generatePairs() {
  const keys = Object.keys(STATEMENT_VARIANTS);
  const pairs = [];
  for (let i = 0; i < keys.length; i++) {
    for (let j = i + 1; j < keys.length; j++) {
      for (let v = 0; v < VARIANT_COUNT; v++) {
        const swap = Math.random() < 0.5;
        const left  = swap ? keys[j] : keys[i];
        const right = swap ? keys[i] : keys[j];
        pairs.push({ left, right, variant: v });
      }
    }
  }
  for (let i = pairs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
  }
  return pairs;
}

// each type appears against 5 other types x 3 variants = 15 times
const PER_TYPE_MAX = (Object.keys(STATEMENT_VARIANTS).length - 1) * VARIANT_COUNT;

let QUESTIONS = generatePairs();
let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);
let showResult = false;
let userName = "";

function syncReportMeta(value) {
  userName = value;
  const printName = document.getElementById("printName");
  if (printName) printName.textContent = value || "未記入";
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = showResult ? renderResult() : renderQuiz();
}

function renderQuiz() {
  const q = QUESTIONS[current];
  const pct = Math.round((current / QUESTIONS.length) * 100);
  const selected = answers[current];

  const optionCard = (key) => `
    <button class="option-card ${selected === key ? 'chosen' : ''}" onclick="selectAnswer('${key}')">
      ${STATEMENT_VARIANTS[key][q.variant]}
    </button>
  `;

  return `
    <h1>コミュニケーションタイプ診断</h1>
    <p class="lede">より近いと感じる方を選んでください(強制選択式・全${QUESTIONS.length}問)</p>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="q-count">質問 ${current + 1} / ${QUESTIONS.length}</div>
      <div class="q-text">どちらがより自分に近いですか?</div>
      <div class="options">
        ${optionCard(q.left)}
        <div class="or-label">または</div>
        ${optionCard(q.right)}
      </div>
      <div class="nav">
        <button onclick="prevQ()" ${current === 0 ? "disabled" : ""}>← 戻る</button>
        <button onclick="nextQ()" ${selected === null ? "disabled" : ""}>${current === QUESTIONS.length - 1 ? "結果を見る →" : "次へ →"}</button>
      </div>
    </div>
  `;
}

function selectAnswer(key) {
  answers[current] = key;
  render();
}

function nextQ() {
  if (answers[current] === null) return;
  if (current === QUESTIONS.length - 1) {
    showResult = true;
  } else {
    current++;
  }
  render();
}

function prevQ() {
  if (current > 0) {
    current--;
    render();
  }
}

function computeScores() {
  const scores = {};
  Object.keys(STATEMENT_VARIANTS).forEach(t => scores[t] = 0);
  answers.forEach(chosenKey => {
    if (chosenKey) scores[chosenKey] += 1;
  });
  return scores;
}

function computeConsistency() {
  const groups = {};
  QUESTIONS.forEach((q, i) => {
    const combo = [q.left, q.right].sort().join("_");
    if (!groups[combo]) groups[combo] = [];
    groups[combo].push(answers[i]);
  });
  let consistentCount = 0;
  const comboKeys = Object.keys(groups);
  const inconsistentCombos = [];
  comboKeys.forEach(combo => {
    const arr = groups[combo];
    const allSame = arr.every(a => a === arr[0]);
    if (allSame) {
      consistentCount++;
    } else {
      inconsistentCombos.push(combo.split("_").map(k => TYPES[k].name.split("(")[0]).join(" と "));
    }
  });
  const total = comboKeys.length;
  const pct = Math.round((consistentCount / total) * 100);
  return { consistentCount, total, pct, inconsistentCombos };
}

  const consistency = computeConsistency();

        <p class="channel-detail">${t.channelDetail}</p>
        <ul class="detail-list example">
          ${t.channelExamples.map(s => `<li>${s}</li>`).join("")}
        </ul>

        <p class="section-label">組織における適正な職位・役割</p>
        <p class="role-block">${t.role}</p>
        <p class="role-note">※職位や配属を固定する根拠ではなく、力を発揮しやすい傾向として参考にしてください。</p>

        <p class="section-label">満たされやすい基本的欲求 & 対話のきっかけ</p>
        <p class="role-block">主に満たされやすい欲求: <strong>${t.glasserNeed}</strong></p>
        <p class="stage-sub">上質世界を問いかける質問(1on1などでそのまま使えます)</p>
        <ul class="detail-list">
          ${t.qualityWorldQuestions.map(q => `<li>${q}</li>`).join("")}
        </ul>
        <p class="role-note">※これはウィリアム・グラッサーの選択理論(5つの基本的欲求・上質世界)とPCMを概念的に橋渡しした試験的な整理です。両理論が公式に統合されているわけではありません。</p>

        <p class="section-label">ストレス反応の3段階と関わり方</p>
        ${t.stages.map(stage => `
          <div class="stage-block">
            <div class="stage-title">${stage.level}</div>
            <div class="stage-desc">${stage.desc}</div>
            <div class="stage-sub">してみるとよいこと</div>
            <ul class="detail-list do">${stage.good.map(s => `<li>${s}</li>`).join("")}</ul>
            <div class="stage-sub">避けたいこと</div>
            <ul class="detail-list dont">${stage.bad.map(s => `<li>${s}</li>`).join("")}</ul>
          </div>
        `).join("")}

        <p class="section-label">事例</p>
        <p class="case-study">${t.caseStudy}</p>
      </div>
      `;
    }).join("")}

    <button class="restart" onclick="restart()">もう一度診断する</button>
  `;
}

function restart() {
  QUESTIONS = generatePairs();
  answers = new Array(QUESTIONS.length).fill(null);
  current = 0;
  showResult = false;
  render();
}

function downloadTextReport() {
  const scores = computeScores();
  const consistency = computeConsistency();
  const maxScore = PER_TYPE_MAX;
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const top = TYPES[sorted[0][0]];
  const now = new Date();
  const dateStr = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()}`;

  let lines = [];
  lines.push("========================================");
  lines.push("コミュニケーションタイプ診断レポート");
  lines.push(`氏名: ${userName || "未記入"}`);
  lines.push(`診断日: ${dateStr}`);
  lines.push("========================================");
  lines.push("");
  lines.push(`最も傾向が強いタイプ: ${top.name}`);
  lines.push("");
  lines.push("--- 6タイプのスコア(強い順) ---");
  sorted.forEach(([key, val]) => {
    lines.push(`${TYPES[key].name}: ${val} / ${maxScore}`);
  });
  lines.push("");
  lines.push("--- 回答の一貫性(内的一貫性チェック) ---");
  lines.push(`${consistency.consistentCount} / ${consistency.total} 組み合わせで一貫した回答 (${consistency.pct}%)`);
  if (consistency.inconsistentCombos.length > 0) {
    lines.push("選ぶ方が割れた組み合わせ:");
    consistency.inconsistentCombos.forEach(c => lines.push(`  - ${c}`));
  }
  lines.push("");
  lines.push("注記: これは簡易的な自己診断ツールであり、統計的検証を経た正式なアセスメントではありません。");
  lines.push("人事評価・配置・採用など重みのある意思決定には、公式のPCM認定トレーナーによるアセスメントをご利用ください。");
  lines.push("");

  sorted.forEach(([key, val]) => {
    const t = TYPES[key];
    lines.push("========================================");
    lines.push(`${t.name} (スコア ${val} / ${maxScore})`);
    lines.push("========================================");
    lines.push("");
    lines.push(`[強み]`);
    lines.push(t.strengths);
    lines.push("");
    lines.push(`[求める心理的欲求]`);
    lines.push(t.need);
    lines.push("");
    lines.push(`[伝わりやすい関わり方: ${t.channel}]`);
    lines.push(t.channelDetail);
    t.channelExamples.forEach(e => lines.push(`  ${e}`));
    lines.push("");
    lines.push(`[組織における適正な職位・役割]`);
    lines.push(t.role);
    lines.push("");
    lines.push(`[満たされやすい基本的欲求 & 対話のきっかけ(グラッサー選択理論との橋渡し・試験的整理)]`);
    lines.push(`主に満たされやすい欲求: ${t.glasserNeed}`);
    lines.push("上質世界を問いかける質問:");
    t.qualityWorldQuestions.forEach(q => lines.push(`  - ${q}`));
    lines.push("");
    lines.push(`[ストレス反応の3段階]`);
    t.stages.forEach(stage => {
      lines.push(`  ${stage.level}: ${stage.desc}`);
      lines.push(`    してみるとよいこと:`);
      stage.good.forEach(g => lines.push(`      - ${g}`));
      lines.push(`    避けたいこと:`);
      stage.bad.forEach(b => lines.push(`      - ${b}`));
    });
    lines.push("");
    lines.push(`[事例]`);
    lines.push(t.caseStudy);
    lines.push("");
  });

  const text = lines.join("\n");
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `pcm-diagnosis-report-${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, "0")}${String(now.getDate()).padStart(2, "0")}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

render();
</script>
</body>
</html>
